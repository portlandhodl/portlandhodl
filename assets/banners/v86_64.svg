<text x="254" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" fill="#b8b4e6">Boot 64-bit Linux in your browser. x86-64 PC emulator + x86-to-WebAssembly JIT.</text>
